<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔴 J.A.R.V.I.S. AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #0ff; font-family: monospace; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85) contrast(1.1); position: absolute; top:0; left:0; }
        #glcanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        #startScreen h1 { font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 20px #0ff; }
        #startBtn { padding: 20px 50px; font-size: 24px; background: #002233; color: #0ff; border: 3px solid #0ff; border-radius: 10px; cursor: pointer; }
        #error { color: #f00; margin-top: 20px; text-align: center; padding: 20px; }

        #title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; text-shadow: 0 0 10px #0ff; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; z-index: 5; }

        .corner { position: absolute; width: 40px; height: 40px; border: 3px solid #0ff; filter: drop-shadow(0 0 6px #0ff); opacity: 0.8; z-index: 5; }
        .corner.tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .corner.tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .corner.bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .corner.br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        #menuTab {
            position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            width: 28px; height: 90px;
            background: rgba(0,20,30,0.75);
            border: 2px solid #0ff; border-left: none;
            border-radius: 0 10px 10px 0;
            display: flex; align-items: center; justify-content: center;
            color: #0ff; font-size: 18px; z-index: 15;
            box-shadow: 0 0 12px rgba(0,255,255,0.5);
            touch-action: none;
        }

        #sideMenu {
            position: absolute; top: 0; left: 0; height: 100%; width: 90px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px;
            background: rgba(0,10,20,0.85);
            border-right: 2px solid #0ff;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            z-index: 14; padding: 10px;
        }
        #sideMenu.open { transform: translateX(0); }

        .sbtn {
            width: 64px; height: 64px; font-size: 26px;
            background: #002233; color: #0ff; border: 2px solid #0ff; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .sbtn.active { background: #0ff; color: #000; }

        #hint {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            font-size: 11px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;
            z-index: 5; opacity: 0.8; white-space: nowrap; text-align: center;
        }

        /* Точка-курсор кончика пальца, для наглядности пока подстраиваешь руку */
        #fingerDot {
            position: absolute;
            width: 18px; height: 18px;
            border: 2px solid #0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0ff;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="glcanvas"></canvas>
        <div id="fingerDot"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div id="startScreen">
            <h1>🔴 J.A.R.V.I.S. AR</h1>
            <button id="startBtn">▶ ЗАПУСТИТЬ</button>
            <div id="error"></div>
        </div>

        <div id="title">J.A.R.V.I.S. AR</div>
        <div id="hint">Рука в камере: —</div>

        <div id="menuTab">☰</div>

        <div id="sideMenu">
            <button class="sbtn active" data-mode="1">🔷</button>
            <button class="sbtn" data-mode="2">🔵</button>
            <button class="sbtn" data-mode="3">⭐</button>
            <button class="sbtn" data-mode="5">🎯</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('startScreen');
        const errorDiv = document.getElementById('error');
        const menuTab = document.getElementById('menuTab');
        const sideMenu = document.getElementById('sideMenu');
        const glcanvas = document.getElementById('glcanvas');
        const hint = document.getElementById('hint');
        const fingerDot = document.getElementById('fingerDot');

        let mode = 1;

        // ---------- Боковое меню ----------
        let menuOpen = false;
        function setMenu(open) {
            menuOpen = open;
            sideMenu.classList.toggle('open', open);
        }
        menuTab.addEventListener('click', () => setMenu(!menuOpen));

        // ---------- Three.js scene ----------
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ canvas: glcanvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const CYAN = 0x00f0ff;

        let holoGroup = new THREE.Group();
        holoGroup.scale.set(0.45, 0.45, 0.45);
        scene.add(holoGroup);

        function clearHolo() {
            while (holoGroup.children.length) holoGroup.remove(holoGroup.children[0]);
        }
        function glowLineMaterial(opacity = 1) {
            return new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity });
        }
        function addWireframe(geometry) {
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, glowLineMaterial());
            holoGroup.add(line);
            const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
                color: CYAN, transparent: true, opacity: 0.06, side: THREE.DoubleSide
            }));
            holoGroup.add(mesh);
        }
        function buildCube() { clearHolo(); addWireframe(new THREE.BoxGeometry(1.6, 1.6, 1.6)); }
        function buildSphere() {
            clearHolo();
            addWireframe(new THREE.SphereGeometry(1, 16, 12));
            for (let i = 0; i < 2; i++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(1 + i * 0.25, 0.006, 8, 64),
                    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.7 })
                );
                ring.rotation.x = Math.PI / 2;
                holoGroup.add(ring);
            }
        }
        function buildStar() { clearHolo(); addWireframe(new THREE.IcosahedronGeometry(1.1, 0)); }
        function buildRings() {
            clearHolo();
            for (let i = 0; i < 4; i++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.5 + i * 0.35, 0.008, 8, 64),
                    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.8 - i * 0.15 })
                );
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                ring.userData.spin = 0.005 + i * 0.002;
                holoGroup.add(ring);
            }
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshBasicMaterial({ color: CYAN }));
            holoGroup.add(core);
        }
        function setMode(m) {
            mode = m;
            if (m === 1) buildCube();
            else if (m === 2) buildSphere();
            else if (m === 3) buildStar();
            else if (m === 5) buildRings();
        }
        setMode(1);

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        // ---------- Камера ----------
        async function startCamera() {
            errorDiv.textContent = 'Подключаю камеру...';
            try {
                let stream = null;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
                video.srcObject = stream;

                try {
                    const track = stream.getVideoTracks()[0];
                    const caps = track.getCapabilities ? track.getCapabilities() : null;
                    if (caps && caps.zoom) {
                        await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
                    }
                } catch (e) { /* необязательно, игнорируем */ }

                video.onloadedmetadata = () => {
                    startScreen.style.display = 'none';
                    onResize();
                    animate();
                    initHandTracking();
                };
            } catch (e) {
                errorDiv.textContent = 'Ошибка: ' + e.message;
            }
        }

        // ---------- Перевод координат экрана в мировые координаты сцены ----------
        function screenPxToWorld(px, py) {
            // px, py — координаты в пикселях экрана (0..innerWidth/Height)
            const ndcX = (px / window.innerWidth) * 2 - 1;
            const ndcY = -((py / window.innerHeight) * 2 - 1);
            const distanceFromCamera = camera.position.z; // holoGroup находится примерно на z=0
            const vFOV = (camera.fov * Math.PI) / 180;
            const halfHeight = Math.tan(vFOV / 2) * distanceFromCamera;
            const halfWidth = halfHeight * camera.aspect;
            return { x: ndcX * halfWidth, y: ndcY * halfHeight };
        }

        // ---------- Управление пальцем ПО ЭКРАНУ (запасной вариант) ----------
        let dragging = false;
        let lastX = 0, lastY = 0, lastTime = 0;
        let velX = 0, velY = 0;

        glcanvas.addEventListener('pointerdown', (e) => {
            dragging = true;
            lastX = e.clientX; lastY = e.clientY; lastTime = performance.now();
            velX = 0; velY = 0;
            glcanvas.setPointerCapture(e.pointerId);
        });
        glcanvas.addEventListener('pointermove', (e) => {
            if (!dragging || handActive) return; // если рука активна, экран не мешает
            const now = performance.now();
            const dt = Math.max(now - lastTime, 1);
            const dx = e.clientX - lastX, dy = e.clientY - lastY;
            const k = 0.0045;
            holoGroup.position.x += dx * k;
            holoGroup.position.y -= dy * k;
            velX = dx * k / dt * 16;
            velY = -dy * k / dt * 16;
            lastX = e.clientX; lastY = e.clientY; lastTime = now;
        });
        function endDrag() { dragging = false; }
        glcanvas.addEventListener('pointerup', endDrag);
        glcanvas.addEventListener('pointercancel', endDrag);

        // ---------- Управление РУКОЙ ЧЕРЕЗ КАМЕРУ (MediaPipe Hands) ----------
        // Экспериментально: если библиотека не загрузится или телефон
        // не потянет — просто ничего не произойдёт, останется управление
        // пальцем по экрану (см. выше).
        let handActive = false;
        let handTargetWorld = null;
        let grabbing = false;

        function initHandTracking() {
            if (typeof Hands === 'undefined') {
                hint.textContent = 'Рука в камере: библиотека не загрузилась (используй палец по экрану)';
                return;
            }
            try {
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0, // облегчённая модель — важно для скорости на телефоне
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.5
                });
                hands.onResults(onHandResults);

                hint.textContent = 'Рука в камере: запускаю распознавание...';

                async function handLoop() {
                    if (video.readyState >= 2) {
                        await hands.send({ image: video });
                    }
                    requestAnimationFrame(handLoop);
                }
                handLoop();
            } catch (e) {
                hint.textContent = 'Рука в камере: не удалось запустить';
            }
        }

        // Сглаженные координаты кончика пальца (уменьшают дрожание)
        let smoothTipX = null, smoothTipY = null;
        const SMOOTH_K = 0.4; // 0..1, больше = быстрее реагирует, но больше дрожь

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handActive = true;

                const lm = results.multiHandLandmarks[0];
                const tip = lm[8];       // кончик указательного пальца
                const thumbTip = lm[4];  // кончик большого пальца
                const wrist = lm[0];     // запястье
                const middleMcp = lm[9]; // основание среднего пальца

                // сглаживание кончика пальца (экспоненциальное скользящее среднее)
                if (smoothTipX === null) { smoothTipX = tip.x; smoothTipY = tip.y; }
                smoothTipX += (tip.x - smoothTipX) * SMOOTH_K;
                smoothTipY += (tip.y - smoothTipY) * SMOOTH_K;

                const px = smoothTipX * window.innerWidth;
                const py = smoothTipY * window.innerHeight;

                handTargetWorld = screenPxToWorld(px, py);

                fingerDot.style.display = 'block';
                fingerDot.style.left = px + 'px';
                fingerDot.style.top = py + 'px';

                // Размер ладони в кадре (запястье -> основание среднего пальца).
                // Используем его как "линейку", чтобы порог щипка не зависел
                // от того, насколько близко/далеко рука от камеры.
                const handSize = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y) || 0.15;
                const pinchDist = Math.hypot(tip.x - thumbTip.x, tip.y - thumbTip.y);
                const pinchRatio = pinchDist / handSize;

                // Гистерезис: порог "схватить" ниже порога "отпустить",
                // чтобы захват не дребезжал на границе значения.
                const wasGrabbing = grabbing;
                if (!wasGrabbing && pinchRatio < 0.45) {
                    grabbing = true;
                } else if (wasGrabbing && pinchRatio > 0.65) {
                    grabbing = false;
                }

                // Обратная связь: вибрация в момент захвата + пульсация точки
                if (grabbing && !wasGrabbing && navigator.vibrate) {
                    navigator.vibrate(30);
                }
                fingerDot.style.background = grabbing ? 'rgba(0,255,255,0.6)' : 'transparent';
                fingerDot.style.transform = grabbing
                    ? 'translate(-50%,-50%) scale(1.6)'
                    : 'translate(-50%,-50%) scale(1)';
                fingerDot.style.transition = 'transform 0.12s ease, background 0.12s ease';

                hint.textContent = grabbing ? 'Рука в камере: захват 🤏' : 'Рука в камере: найдена ✋';
            } else {
                handActive = false;
                grabbing = false;
                smoothTipX = null; smoothTipY = null;
                fingerDot.style.display = 'none';
                hint.textContent = 'Рука в камере: не видна (покажи ладонь камере)';
            }
        }

        // ---------- Анимация ----------
        let t = 0;
        function animate() {
            requestAnimationFrame(animate);
            t += 0.016;

            holoGroup.rotation.y += 0.012;
            holoGroup.rotation.x = Math.sin(t * 0.5) * 0.15;

            if (handActive && handTargetWorld) {
                // плавно тянемся к позиции пальца, только пока щипок ("захват")
                const followSpeed = grabbing ? 0.25 : 0.06;
                holoGroup.position.x += (handTargetWorld.x - holoGroup.position.x) * followSpeed;
                holoGroup.position.y += (handTargetWorld.y - holoGroup.position.y) * followSpeed;
            } else if (!dragging && (Math.abs(velX) > 0.0001 || Math.abs(velY) > 0.0001)) {
                holoGroup.position.x += velX;
                holoGroup.position.y += velY;
                velX *= 0.92; velY *= 0.92;
            }

            holoGroup.visible = Math.random() > 0.01;

            holoGroup.children.forEach(c => {
                if (c.userData && c.userData.spin) {
                    c.rotation.x += c.userData.spin;
                    c.rotation.y += c.userData.spin * 1.3;
                }
            });

            renderer.render(scene, camera);
        }

        document.querySelectorAll('.sbtn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sbtn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setMode(parseInt(btn.dataset.mode));
                setMenu(false);
            });
        });

        startBtn.addEventListener('click', startCamera);
    </script>
</body>
</html>
